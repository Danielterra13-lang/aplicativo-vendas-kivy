name: Build Android APK

# Roda toda vez que um push chega na main, ou manualmente pela aba "Actions"
# do GitHub ("Run workflow"). O build inteiro acontece nos servidores do
# GitHub -- não precisa de VirtualBox, WSL nem nada instalado no seu PC.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build para Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Usa a imagem Docker oficial do Kivy (kivy/buildozer, publicada no
      # Docker Hub) direto com "docker run" -- evita depender de uma action
      # de terceiro que builda sua própria imagem customizada a cada run
      # (etapa instável, foi o que quebrou na primeira tentativa).
      - name: Build com Buildozer (imagem oficial kivy/buildozer)
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-vendas-apk
          path: bin/*.apk
